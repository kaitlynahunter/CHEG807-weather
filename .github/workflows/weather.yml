name: Collect Miami Weather

on:
  schedule:
    - cron: "40 7 * * *"
      timezone: "America/New_York"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install pandas requests

      - name: Collect Miami weather
        run: python collect_weather.py

      - name: Save weather data
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add miami_weather_forecast_log.csv
          git commit -m "Add daily Miami weather forecast" || exit 0
          git push
